[package]
name = "ember"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Ember 本地优先知识工作台的宿主进程"

[lib]
name = "ember_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22.1"
sha2 = "0.10"
thiserror = "2.0.21"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
# 流式取消的 select! 竞速与轮询定时器（reqwest 传递依赖已带 tokio，显式声明宏与 time 特性）
tokio = { version = "1.54", default-features = false, features = ["macros", "time"] }
# ulid 的熵回退（macOS 走 getentropy 系统调用）；版本已在依赖树中，零新增下载
getrandom = "0.4"
