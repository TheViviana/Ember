[package]
name = "ember"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Ember 本地优先知识工作台的宿主进程"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "ember_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22.1"
sha2 = "0.10"
thiserror = "2.0.21"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls"] }
# 流式取消的 select! 竞速与轮询定时器（reqwest 传递依赖已带 tokio，显式声明宏与 time 特性）
tokio = { version = "1.54", default-features = false, features = ["macros", "time"] }
# ulid 的熵回退（macOS 走 getentropy 系统调用）；版本已在依赖树中，零新增下载
getrandom = "0.4"

# 删除落点：NSFileManager.trashItemAtURL（vault/trash.rs）。版本对齐 Cargo.lock（objc2 0.6.5 /
# objc2-foundation 0.3.2），零新增下载。只开用到的方法所必需的 feature：
# trashItemAtURL 在 NSError + NSURL 门控内，fileURLWithPath 需要 NSString，
# 卷预检用 getResourceValue + NSNumber。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSFileManager", "NSURL", "NSError", "NSString", "NSValue"] }
# 首启选库的原生目录面板：NSOpenPanel（vault/picker.rs）。版本对齐 Cargo.lock
# （tao/wry 已编译的 objc2-app-kit 0.3.2），零新增下载。
# 关掉 default-features（默认会启用整套 AppKit 并拖入 cloud-kit/core-image 等新包），
# 只开面板及其父类所需 feature。
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
